# Application Configuration
quarkus.application.name=airline-loyalty-assistant
quarkus.http.port=8080

# Qute Configuration
quarkus.qute.dev-mode.check-template-modification=true

# OpenAI Configuration (externalized for security)
# Set OPENAI_API_KEY environment variable
openai.api.key=${OPENAI_API_KEY:}

# Logging Configuration
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."com.airline.loyalty".level=DEBUG

# Development Configuration
quarkus.dev.instrumentation=true
